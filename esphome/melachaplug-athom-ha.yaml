# MelachaPlug Athom PG03V3 — for HA ESPHome dashboard
# Copy this entire file content into the ESPHome device config after adopting.
#
# This file pulls all firmware code from our GitHub fork via remote_package.
# No local files needed — everything is downloaded at compile time.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

substitutions:
  device_name: "melachaplug-athom"
  friendly_name: "Melacha Plug Athom"

  relay_1_gpio: "5"
  button_1_gpio: "3"
  built_in_led_gpio: "6"
  led_inverted: "true"

  relay_restore_mode: "ALWAYS_OFF"
  inverted_shabbos_mode: "RESTORE_DEFAULT_OFF"

  timezone: America/New_York
  eretz_yisrael: "RESTORE_DEFAULT_OFF"

  latitude: "40.669000"
  longitude: "-73.942770"

  min_offset_start: "-30"
  min_offset_end: "0"

  deg_shabbos_starts: "-0.833"
  deg_shabbos_ends: "-8.5"
  deg_tzeit: "-6"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - header-files/hebrewcalender_melachaplug.h
    - header-files/ntp_config_melachaplug.h
    - header-files/melachaplug_main.h

packages:
  remote_package:
    url: https://github.com/kingbear2/melachaplug/
    ref: main
    files:
      - esphome/plugins/melachaplug/melacha_config.yaml
      - esphome/plugins/melachaplug/athom_pg03v3_hardware.yaml
      - esphome/plugins/melachaplug/location_info.yaml
      - esphome/plugins/melachaplug/optional_config.yaml
    refresh: 1d