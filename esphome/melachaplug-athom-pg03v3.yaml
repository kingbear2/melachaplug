# Athom PG03V3-US16A — Melacha Plug
# ESP32-C3, 4MB flash, 16A, energy monitoring, pre-flashed with ESPHome or Tasmota
# Flash via OTA from the Athom web UI (no USB adapter needed)

wifi:
  ssid: !secret wifi_ssid5
  password: !secret wifi_password5

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB

substitutions:
  device_name: "melachaplug-athom"
  friendly_name: "Melacha Plug Athom"

  relay_1_gpio: "5"
  button_1_gpio: "3"
  built_in_led_gpio: "6"
  led_inverted: "true"

  relay_restore_mode: "ALWAYS_OFF"
  inverted_shabbos_mode: "RESTORE_DEFAULT_OFF"

  timezone: America/New_York
  eretz_yisrael: "RESTORE_DEFAULT_OFF"

  latitude: "40.669000"
  longitude: "-73.942770"

  min_offset_start: "-30"
  min_offset_end: "0"

  deg_shabbos_starts: "-0.833"
  deg_shabbos_ends: "-8.5"
  deg_tzeit: "-6"

esphome:
  includes:
    - header-files/hebrewcalender_melachaplug.h
    - header-files/melachaplug_main.h

packages:
  melacha_config: !include plugins/melachaplug/melacha_config.yaml
  athom_hardware: !include plugins/melachaplug/athom_pg03v3_hardware.yaml
  location_info: !include plugins/melachaplug/location_info.yaml
  optional_config: !include plugins/melachaplug/optional_config.yaml