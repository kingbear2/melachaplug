#--------------------------------------------
#---------------- Plug Info -----------------
#--------------------------------------------
switch:
  - platform: gpio
    name: 20 Relay 1
    id: relay_1
    pin:
      number: ${relay_1_gpio}
    restore_mode: ${relay_restore_mode}  # defaults to on
    on_turn_on:
      then:
        - switch.turn_on: built_in_led
    on_turn_off:
      then:
        - switch.turn_off: built_in_led

  # switch which can disable the button
  - platform: gpio
    pin:
      number: ${button_1_gpio}
      allow_other_uses: true
    name: 21 Enable Button 1
    id: enable_button_1
    internal: true
    inverted: false
    restore_mode: ALWAYS_OFF         # defaults to off in case of reset on Shabbos or Yom Tov

  # LED flash preset
  - platform: template
    name: 22 Flash LED
    id: flash_led
    disabled_by_default: true
    optimistic: yes
    restore_mode: DISABLED
    on_turn_on:
    - while:
        condition:
          switch.is_on: flash_led
        then:
        - switch.turn_on: built_in_led
        - delay: 75ms
        - switch.turn_off: built_in_led
        - delay: 75ms
        - switch.turn_on: built_in_led
        - delay: 75ms
        - switch.turn_off: built_in_led
        - delay: 2875ms
    on_turn_off:
    - switch.turn_off: built_in_led

  - platform: gpio
    name: 23 Built-in LED
    disabled_by_default: true
    id: built_in_led
    pin:
      number: ${built_in_led_gpio}
    restore_mode: ${relay_restore_mode}    # defaults to the same as the relay
    inverted: ${led_inverted}

binary_sensor:
  - platform: gpio
    id: button_1
    pin:
      number: ${button_1_gpio}
      mode: INPUT_PULLUP
      allow_other_uses: true
    inverted: true
    filters:
      - delayed_on: 10ms
    on_click:
      - min_length: 10ms
        max_length: 350ms
        then:
          - lambda: |-
              static uint32_t last_click_time = 0;
              static int click_count = 0;
              static bool pending_single = false;
              uint32_t now = millis();
              if (now - last_click_time < 2000) {
                click_count++;
              } else {
                click_count = 1;
              }
              last_click_time = now;
              ESP_LOGD("button", "Click count: %d", click_count);
              if (click_count >= 3) {
                // Triple click: toggle invert mode
                ESP_LOGD("button", "Triple click - toggling invert mode");
                id(inverted_shabbos_mode).toggle();
                click_count = 0;
                pending_single = false;
                // Signal with LED triple-blink
                id(built_in_led).turn_on();
                delay(150);
                id(built_in_led).turn_off();
                delay(150);
                id(built_in_led).turn_on();
                delay(150);
                id(built_in_led).turn_off();
                delay(150);
                id(built_in_led).turn_on();
                delay(150);
                id(built_in_led).turn_off();
              } else if (click_count == 1) {
                // Single click: delay the relay toggle to see if more clicks come
                pending_single = true;
              } else if (click_count == 2) {
                // Double click: cancel single click action
                pending_single = false;
              }
          - delay: 500ms
          - lambda: |-
              static int click_count = 0;
              static bool pending_single = false;
              if (pending_single) {
                ESP_LOGD("button", "Single click confirmed - toggling relay");
                id(relay_1).toggle();
                pending_single = false;
              }
              click_count = 0;
