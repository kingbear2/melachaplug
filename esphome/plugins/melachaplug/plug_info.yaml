#--------------------------------------------
#---------------- Plug Info -----------------
#--------------------------------------------
switch:
  - platform: gpio
    name: 20 Relay 1
    id: relay_1
    pin:
      number: ${relay_1_gpio}
    restore_mode: ${relay_restore_mode}  # defaults to on
    on_turn_on:
      then:
        - switch.turn_on: built_in_led
    on_turn_off:
      then:
        - switch.turn_off: built_in_led

  # switch which can disable the button
  - platform: gpio
    pin:
      number: ${button_1_gpio}
      allow_other_uses: true
    name: 21 Enable Button 1
    id: enable_button_1
    internal: true
    inverted: false
    restore_mode: ALWAYS_OFF         # defaults to off in case of reset on Shabbos or Yom Tov

  # LED flash preset
  - platform: template
    name: 22 Flash LED
    id: flash_led
    disabled_by_default: true
    optimistic: yes
    restore_mode: DISABLED
    on_turn_on:
    - while:
        condition:
          switch.is_on: flash_led
        then:
        - switch.turn_on: built_in_led
        - delay: 75ms
        - switch.turn_off: built_in_led
        - delay: 75ms
        - switch.turn_on: built_in_led
        - delay: 75ms
        - switch.turn_off: built_in_led
        - delay: 2875ms
    on_turn_off:
    - switch.turn_off: built_in_led

  - platform: gpio
    name: 23 Built-in LED
    disabled_by_default: true
    id: built_in_led
    pin:
      number: ${built_in_led_gpio}
    restore_mode: ${relay_restore_mode}    # defaults to the same as the relay
    inverted: ${led_inverted}

binary_sensor:
  - platform: gpio
    id: button_1
    pin:
      number: ${button_1_gpio}
      mode: INPUT_PULLUP
      allow_other_uses: true
      inverted: true
    filters:
      - delayed_on: 10ms
    on_click:
      - min_length: 10ms
        max_length: 350ms
        then:
          - lambda: |-
              // Check if button is locked (Shabbos/Yom Tov)
              if (!id(enable_button_1).state) {
                ESP_LOGD("button", "Button locked - ignoring click");
                return;
              }
              static uint32_t last_click = 0;
              static int count = 0;
              uint32_t now = millis();
              if (now - last_click < 2000) { count++; } else { count = 1; }
              last_click = now;
              if (count >= 3) {
                id(inverted_shabbos_mode).toggle();
                count = 0;
                for (int i = 0; i < 3; i++) {
                  id(built_in_led).turn_on(); delay(150);
                  id(built_in_led).turn_off(); delay(150);
                }
              } else if (count == 1) {
                delay(500);
                if (count == 1) {
                  id(relay_1).toggle();
                  count = 0;
                }
              }
