# Athom SW13C3 US Key Switch — Melacha Plug firmware
# ESP32-C3, 4MB flash, wall switch, pre-flashed with ESPHome
# Use case: disables physical button during Shabbos/Yom Tov to prevent accidental toggling
# Relay follows Shabbos/Yom Tov schedule (normal or inverted mode)

wifi:
  ssid: !secret wifi_ssid5
  password: !secret wifi_password5

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB

substitutions:
  device_name: "melachaswitch-athom"
  friendly_name: "Melacha Switch"

  relay_1_gpio: "5"
  button_1_gpio: "20"
  built_in_led_gpio: "9"
  led_inverted: "true"

  relay_restore_mode: "ALWAYS_OFF"
  inverted_shabbos_mode: "RESTORE_DEFAULT_OFF"

  timezone: America/New_York
  eretz_yisrael: "RESTORE_DEFAULT_OFF"

  latitude: "40.669000"
  longitude: "-73.942770"

  min_offset_start: "-30"
  min_offset_end: "0"

  deg_shabbos_starts: "-0.833"
  deg_shabbos_ends: "-8.5"
  deg_tzeit: "-6"

esphome:
  includes:
    - header-files/hebrewcalender_melachaplug.h
    - header-files/melachaplug_main.h

packages:
  melacha_config: !include plugins/melachaplug/melacha_config.yaml
  switch_hardware: !include plugins/melachaplug/athom_sw13_hardware.yaml
  location_info: !include plugins/melachaplug/location_info.yaml
  optional_config: !include plugins/melachaplug/optional_config.yaml